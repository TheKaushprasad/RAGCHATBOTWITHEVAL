<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password · Queryva</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
</head>
<body data-page="reset">
  <main class="auth">
    <a class="auth-logo" href="/"><img src="/favicon.svg" alt="" width="34" height="34" /><span>Queryva</span></a>
    <section class="auth-card">
      <h1>Set a new password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>
      <p id="auth-msg" class="auth-msg" role="alert" hidden></p>
      <form id="auth-form" novalidate>
        <label>New password
          <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          <small>At least 8 characters.</small>
        </label>
        <label>Confirm new password
          <input name="confirm" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit" class="auth-btn">Set new password</button>
      </form>
      <p class="auth-alt"><a href="/forgot-password/">Request a new reset link</a></p>
    </section>
    <p class="auth-foot"><a href="/login/">Back to log in</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/auth.js"></script>
  <script src="/auth-pages.js"></script>
</body>
</html>
