name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt python-dotenv
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python compiles
        run: python -m compileall -q api rag eval.py eval_answers.py ingest.py
      - name: Frontend scripts parse
        run: for f in public/*.js; do node --check "$f"; done

      - name: Supabase settings (non-secret facts)
        if: env.SUPABASE_SERVICE_KEY != ''
        run: python scripts/ci_diagnose.py

      # Passage-level retrieval on the golden set, against the labels in evals_golden_qrels.json.
      # Reranker off, so this costs ~100 embedding calls. Fails the build below 95%.
      - name: Retrieval eval gate
        if: env.OPENAI_API_KEY != ''  # skipped until the repository secrets are added
        run: python eval.py --compare --k 5 --rerankers none --min 0.95
